# Validate the site. The hosting Git connection deploys main automatically.
name: Validate site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-openengine-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
